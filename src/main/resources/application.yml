spring:
  application:
    name: payflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false   # {"amount": 100.5} is a 400, not silently truncated to 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true   # no duplicate writes when the producer retries
        max.block.ms: 2000         # a missing broker can't stall the request thread for 60 s
    consumer:
      group-id: webhook-dispatcher
      auto-offset-reset: earliest

server:
  port: 8080

app:
  jwt:
    issuer: payflow
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    private-key: ${JWT_PRIVATE_KEY:file:keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:keys/public.pem}
  idempotency:
    in-progress-ttl: 60s
    completed-ttl: 24h
  payments:
    max-amount: 10000000   # paise = Rs 1,00,000 per payment
  webhook:
    url: ${WEBHOOK_URL:http://localhost:8080/demo/merchant-webhook}
    secret: ${WEBHOOK_SECRET:dev-secret}
    demo-receiver: false   # true enables /demo/merchant-webhook (docker-compose turns it on)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
