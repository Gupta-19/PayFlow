spring:
  kafka:
    listener:
      # The producer still publishes, but no consumer runs, so tests don't spend time on webhook retries
      auto-startup: false

app:
  jwt:
    private-key: classpath:test-keys/private.pem
    public-key: classpath:test-keys/public.pem
  webhook:
    # Tests run on a random port, and port 8080 may belong to another app on the machine.
    # Point webhooks at a closed port, so nothing can reach it even if a test starts the listener.
    url: http://127.0.0.1:9/demo/merchant-webhook
